baseURL: "https://har0070.github.io/har.github.io/"
languageCode: "en-us"
title: "Builds"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Step1 to Autonomous cars"
  description: "This work is about converting any normal vehicle to fully drive by wire and make it follow a reference trajectory"
  defaultTheme: auto
  ShowReadingTime: true
  ShowCodeCopyButtons: true
  ShowToc: true
  math: true

  profileMode:
    enabled: false
    title: "Harshin Stark"
    subtitle: "Drive-by-wire | Vehicle Modeling | Control Systems"
    imageUrl: "/images/Harshin.jpeg"
    imageWidth: 160
    imageHeight: 160

markup:
  goldmark:
    renderer:
      unsafe: true
